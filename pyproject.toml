[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-editorial-studio"
version = "0.1.0"
description = "A contract-first, observable editorial studio"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.4", "openai==2.43.0", "streamlit==1.58.0",
  "PyYAML==6.0.3", "python-dotenv==1.2.2", "Pillow==12.2.0",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
segmentation = ["torch==2.9.1+cpu", "torchvision==0.24.1+cpu", "timm==1.0.22", "mobile-sam"]
photo = ["opencv-contrib-python-headless==4.13.0.92", "numpy==2.5.4; python_version >= '3.12'", "numpy==2.3.5; python_version < '3.12'"]
dev = ["pytest==9.1.1", "ruff>=0.14"]
render = ["pycairo==1.29.1", "PyGObject==3.54.5", "shapely==2.2.0", "fonttools==4.68.0", "PyMuPDF==1.27.2.2", "CairoSVG==2.9.1"]

[project.scripts]
editorial-worker = "editorial_studio.worker:main"
editorial-smoke = "editorial_studio.smoke:main"

[tool.setuptools.packages.find]
include = ["editorial_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
exclude = ["editorial_studio/contracts/models.py"]

[tool.ruff.lint.per-file-ignores]
# GI versions must be selected before importing the native namespaces.
"editorial_studio/canvas/typography/engine.py" = ["E402"]

[tool.uv.sources]
mobile-sam = { git = "https://github.com/ChaoningZhang/MobileSAM.git", rev = "f706ad9c4eb7f219c00d9050e46328518ffb65d2" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
