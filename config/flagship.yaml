project: flagship-proof
story:
  id: human-scale-authored
  title: THE HUMAN SCALE OF SPACE
  deck: "PORTRAIT / 01\nBefore the mission,\na person.\nEileen Collins. Photograph: NASA."
  author: Original studio editorial study; not an interview
  paragraphs:
  - >-
    Space is usually pictured at a distance. A bright point leaves the ground. A planet becomes a disc. A machine travels beyond the edge of what we can see. The scale is difficult to hold in the mind, and the person doing the travelling can disappear inside the achievement. A portrait brings that person back into view. Here, before any account of a mission, there is a face looking directly towards us.
  - >-
    The orange suit takes up almost as much space as the person wearing it. Its collar is a hard circle around a familiar expression; its fabric gathers into ordinary folds. Beside it, the dark surface of a helmet holds a small room of reflected light. These are the materials of an extraordinary task, photographed at the distance of a conversation. We can follow a seam, recognise the weight of an object, or notice a hand resting against an edge. The photograph gives a vast subject a place to begin: the scale of a person.
