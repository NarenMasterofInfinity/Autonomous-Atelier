stories:
- id: human-scale
  title: The human scale of space
  deck: A portrait study in preparation, equipment, and the person within the suit.
  author: Original studio acceptance fixture
  section: PORTRAIT
  layout: feature
  paragraphs:
  - 'The face is the first thing we meet. Before the helmet, the bright fabric, or
    the equipment around it, there is a direct look toward the camera. The photograph
    holds two scales together: the familiar scale of a person and the larger task
    suggested by the suit.'
  - A portrait can make a complicated setting readable. The eye moves from the face
    to the collar, follows the folds of the fabric, and returns. Hard surfaces and
    soft material sit close together. Their contrast gives the image its character
    without requiring a diagram or an explanation of every object.
  - This study follows that movement. The headline passes into the same space as the
    figure, while the reading copy has a quieter place of its own. A small overlap
    can suggest depth, but it should leave the words and the expression clear. The
    person remains the point of return.
- id: coffee-pause
  title: The shape of a daily pause
  deck: A cup, a saucer, and the small arrangements that give an ordinary moment its
    form.
  author: Original studio acceptance fixture
  section: ESSAY
  layout: essay
  paragraphs:
  - A cup on a table is a modest subject, but its arrangement rewards attention. The
    curve of the rim repeats in the saucer beneath it. A handle interrupts the circle,
    giving the eye a direction. Around these familiar forms, the tabletop offers a
    quieter surface on which their edges can be seen.
  - The photograph gathers several kinds of contrast into a small space. A light ceramic
    surface meets the darker coffee. The smooth curve of the cup sits against the
    texture of the table. Warm color makes the scene inviting, while the darker areas
    keep it from becoming weightless. Each part has a different job.
  - There is a rhythm in the way we look at such an image. We recognize the whole
    before noticing the details. Then the shape of the handle, the place of the spoon,
    or the narrow interval between cup and saucer becomes more prominent. The subject
    stays the same; our attention changes its scale.
  - An editorial page can follow a similar rhythm. A headline offers the first gesture.
    The photograph brings the reader closer to an object. The essay asks for a slower
    kind of attention. Giving each of these moments a distinct place helps them work
    together without making every element compete for the first glance.
  - The curved line in this study grows from the cup rather than being added as an
    unrelated flourish. Its rise is gentle, and its length gives the lettering room
    to breathe. Elsewhere the reading measure stays steady. Movement belongs to the
    opening; consistency belongs to the sustained passage of words.
  - Empty space is part of that arrangement. It gives an edge enough room to become
    clear and lets a smaller object hold its own against a larger block of text. But
    space still needs a reason. A pause between two elements can connect them; an
    unexplained distance can make them feel as though they belong to different pages.
  - This is the quiet work of arranging ordinary things. Nothing in the cup needs
    to become a symbol for everything else. It is enough to notice its form, place
    it carefully, and make a reading sequence in which the photograph and the essay
    can each be seen at the pace they need.
- id: two-distances
  title: Two distances
  deck: A fictional editorial conversation about looking from a launch pad to the
    texture of a lunar surface.
  author: Original fictional interview for studio acceptance
  section: CONVERSATION
  layout: interview
  paragraphs:
  - 'Q: Why put these two photographs together? A: They offer different ways of looking
    at distance. The launch image begins with a strong vertical movement and a bright
    point near the ground. The lunar image has no single upright figure. Its surface
    asks the eye to travel across marks and changes in texture.'
  - 'Q: What should a reader notice first? A: Let the launch photograph establish
    the larger gesture. The second image can be smaller and quieter. Its role is to
    slow the eye after that first movement, so the reader notices an edge, a hollow,
    or a patch of light rather than looking for another dramatic event.'
  - 'Q: How can a graphic motif help? A: A restrained circle or arc can connect the
    two kinds of looking. It can suggest a route without pretending to be a scientific
    diagram. The mark should borrow its scale and color from the page, leaving the
    photographs to carry the actual detail.'
  - 'Q: What keeps the conversation readable? A: Give the questions and answers a
    continuous measure and enough room to complete each thought. The images can create
    a second rhythm alongside the words. They do not need to interrupt every answer
    to remain part of the same story.'
